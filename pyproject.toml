[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mropes"
version = "0.1.0"
description = "Dataloaders and positional encoding layers for multimodal resampling models."
readme = "README.md"
license = { text = "CC-BY-NC-SA-4.0" }
requires-python = ">=3.9"
dependencies = [
    "black",
    "calflops",
    "einops",
    "flake8",
    "isort",
    "matplotlib",
    "numpy",
    "pillow",
    "torch",
    "torchaudio",
    "torchcodec",
    "torchinfo",
    "torchvision",
    "tqdm",
    "transformers",
    "typer",
    "wandb"
]

[tool.setuptools.packages.find]
where = ["src"]